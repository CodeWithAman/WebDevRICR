<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age-Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="w-25 bg-light rounded shadow border mx-auto mt-5 p-4">
    <h1 class="text-center mb-1">Age Calculator</h1>

    <form class="d-flex flex-column gap-4 align-items-center p-4 w-100">
      <label for="DOB" class="fw-bolder">Enter your Date of Birth</label>
      <input type="date" name="DOB" id="DOB" class="form-control">

      <label for="currentDOB" class="fw-bolder">Current Date</label>
      <input type="date" name="currentDOB" id="currentDOB" class="form-control">

      <button type="submit" class="btn btn-primary">Calculate</button>
    </form>

    <div id="calculatedAge" class="fw-bolder text-center"></div>
  </div>


  <script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"
  ></script>
  <script src="script.js"></script>
</body>
</html>
