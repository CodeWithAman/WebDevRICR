<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" style="max-width: 820px">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <div class="logo-text">Weather-<span>That Keeps You Ahead</span></div>
          <div class="logo-sub">REAL-TIME WEATHER</div>
        </div>
      </div>

      <div class="d-flex gap-2 mb-4 position-relative align-items-center">
        <div class="position-relative flex-grow-1">
          <span class="search-icon" style="font-size: 16px">🔍</span>
          <input
            type="text"
            id="cityName"
            class="form-control search-input w-100"
            style="height: 52px"
            placeholder="Search for a city…"
          />
        </div>
        <button class="btn-search" onclick="getWeather()">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      <div class="main-card mb-3">
        <div class="row align-items-center g-3">
          <div class="col-sm-5 text-center text-sm-start">
            <span class="weather-emoji" id="WeatherEmoji">⛅</span>
          </div>
          <div class="col-sm-7">
            <div class="temp-display" id="Temperature">--°</div>
            <div class="weather-name" id="Weather">—</div>
            <div class="weather-desc" id="Description">
              search a city to begin
            </div>
            <div class="country-pill">🌐 <span id="Country">--</span></div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon-wrap icon-blue">🌡️</div>
            <div class="stat-label">Feels Like</div>
            <div class="stat-value" id="FeelsLike">--</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon-wrap icon-teal">💧</div>
            <div class="stat-label">Humidity</div>
            <div class="stat-value" id="Humidity">--</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon-wrap icon-amber">💨</div>
            <div class="stat-label">Wind Speed</div>
            <div class="stat-value" id="Wind">--</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon-wrap icon-rose">🔵</div>
            <div class="stat-label">Pressure</div>
            <div class="stat-value" id="Pressure">--</div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <div class="stat-card">
            <div class="stat-icon-wrap icon-orange">🔆</div>
            <div class="stat-label">Max Temp</div>
            <div class="stat-value" id="MaxTemp">--</div>
          </div>
        </div>
        <div class="col-6">
          <div class="stat-card">
            <div class="stat-icon-wrap icon-sky">❄️</div>
            <div class="stat-label">Min Temp</div>
            <div class="stat-value" id="MinTemp">--</div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-6">
          <div class="sun-card">
            <div class="sun-icon-wrap icon-amber">🌅</div>
            <div>
              <div class="sun-label">Sunrise</div>
              <div class="sun-value" id="Sunrise">--:--</div>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="sun-card">
            <div class="sun-icon-wrap icon-rose">🌇</div>
            <div>
              <div class="sun-label">Sunset</div>
              <div class="sun-value" id="Sunset">--:--</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
