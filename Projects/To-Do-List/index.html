<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white text-center py-3 shadow">
        <h1 class="fw-bold">To-Do-List</h1>
        <p class="mb-0">Organize your daily tasks</p>
    </header>

    <main class="container py-4">
        <div class="bg-white rounded-4 shadow p-3 d-flex align-items-center gap-3">
            <input type="text" name="newTask" id="newTask" placeholder="Enter your task" class="form-control form-control-lg border shadow-sm">
            <button onclick="addNewTask()" class="btn btn-primary px-4 py-3 d-flex justify-content-center align-items-center gap-2 rounded-4 shadow-sm border-0 flex-shrink-0"><i class="bi bi-plus-circle fs-4"></i>Add new task</button>
        </div>

        <div class="bg-white rounded-4 shadow my-4 p-4 d-none" id="taskDiv">
            <ol class="ps-3" id="taskList"></ol>
        </div>
    </main>

  <script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"
  ></script>
  <script src="script.js"></script>
</body>
</html>
