<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary-Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="card salary-card">
      <div class="row g-0">

        <div class="col-lg-5">
          <div class="left-section">

            <div class="icon-box">
              <i class="bi bi-cash-stack fs-1"></i>
            </div>

            <h1>Salary Calculator</h1>

            <p>
              Calculate your HRA, DA and Gross Salary instantly with a premium
              payroll dashboard UI.
            </p>
          </div>
        </div>


        <div class="col-lg-7">
          <div class="right-section">

            <div class="mb-4">
              <label class="form-label fs-5 fw-bold mb-3">
                Enter Basic Salary
              </label>

              <input
                type="number"
                id="basicSalary"
                class="form-control"
                placeholder="Enter salary amount"
              />

    
              <div id="error" class="text-danger fw-semibold mt-2"></div>
            </div>


            <div class="row g-3">
              <div class="col-md-6">
                <button
                  id="calculateBtn"
                  class="btn btn-primary btn-custom w-100"
                >
                  <span id="btnText"> Calculate Salary </span>


                  <span
                    id="spinner"
                    class="spinner-border spinner-border-sm d-none"
                  ></span>
                </button>
              </div>

              <div class="col-md-6">
                <button id="resetBtn" class="btn btn-dark btn-custom w-100">
                  Reset
                </button>
              </div>
            </div>


            <div id="success" class="success-box mt-4 d-none">
              <i class="bi bi-check-circle-fill"></i>

              Salary calculated successfully!
            </div>


            <div id="result" class="result-section d-none">
              <div class="row g-4">

                <div class="col-md-6">
                  <div class="salary-box">
                    <div class="salary-title">Basic Salary</div>

                    <div id="basicResult" class="salary-value">₹0.00</div>
                  </div>
                </div>


                <div class="col-md-6">
                  <div class="salary-box">
                    <div class="salary-title">HRA (20%)</div>

                    <div id="hraResult" class="salary-value">₹0.00</div>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="salary-box">
                    <div class="salary-title">DA (10%)</div>

                    <div id="daResult" class="salary-value">₹0.00</div>
                  </div>
                </div>


                <div class="col-md-6">
                  <div class="salary-box gross-box">
                    <div class="salary-title">Gross Salary</div>

                    <div id="grossResult" class="salary-value">₹0.00</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
