<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
        <div class="display" id="display">0</div>

        <div class="buttons">

            <button class="btn-custom">AC</button>

            <button class="btn-custom">C</button>

            <button class="btn-custom">%</button>

            <button class="btn-custom operator">/</button>


            <button class="btn-custom">7</button>

            <button class="btn-custom">8</button>

            <button class="btn-custom">9</button>

            <button class="btn-custom operator">*</button>


            <button class="btn-custom">4</button>

            <button class="btn-custom">5</button>

            <button class="btn-custom">6</button>

            <button class="btn-custom operator">-</button>


            <button class="btn-custom">1</button>

            <button class="btn-custom">2</button>

            <button class="btn-custom">3</button>

            <button class="btn-custom operator">+</button>


            <button class="btn-custom">0</button>

            <button class="btn-custom">.</button>

            <button class="btn-custom equal">=</button>
            
        </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
