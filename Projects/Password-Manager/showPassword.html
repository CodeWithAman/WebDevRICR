<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password-Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
      <div class="container">
        <a href="#" class="navbar-brand fw-bold"> Password Manager</a>
        <div>
          <a href="index.html" class="btn btn-light me-2"> Add Password</a>
          <a href="showPassword.html" class="btn btn-outline-light"> View Passwords</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <h2 class="text-center fw-bold mb-4">Saved Passwords</h2>
          <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle text-center">
              <thead class="table-primary">
                <tr>
                  <th>Website</th>
                  <th>Username</th>
                  <th>Password</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div id="emptyMessage" class="text-center fw-semibold fs-5 text-danger d-none">
             No Password Saved
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script2.js"></script>
  </body>
</html>
