<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password-Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a href="#" class="navbar-brand fw-bold"> Password Manager</a>
            <div>
                <a href="index.html" class="btn btn-light me-2"> Add Password</a>
                <a href="showPassword.html" class="btn btn-outline-light"> View Passwords</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div  class="col-lg-6"> 
                <div class="card shadow-lg bottom-0 rounded-4">
                    <div class="card-body p-5">
                        <h2 class="text-center fw-bold mb-4"> Save Password</h2>
                        <form id="passwordForm">
                            <div class="mb-4">
                                <label class="form-label fw-semibold"> Website Name</label>
                                <input type="text" id="website" class="form-control form-control-lg" placeholder="Enter website name">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Username</label>
                                 <input type="text" id="username" placeholder="Enter username" class="form-control form-control-lg">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold"> Password</label>
                                <div class="input-group">
                                    <input type="password" id="password" placeholder="" class="form-control form-control-lg">
                                    <button type="button" class="btn btn-outline-secondary" id="togglePassword"><i class="bi bi-eye"></i></button>
                                </div>
                            </div>
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-primary w-100">Save Password</button>
                                <button type="reset" class="btn btn-danger w-100">Clear</button>
                            </div>
                        </form>
                        <div id="message" class="mt-4 text-center fw-semibold"></div>
                        <div class="alert alert-warning mt-4 mb-0">⚠ Passwords are stored locally in your browser and are not encrypted.</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
