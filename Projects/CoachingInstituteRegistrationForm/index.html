<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip-Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bg-primary text-white text-center py-4">
      <h1>Coaching Institute Registration Form</h1>
    </header>

    <main>
      <section class="container">
        <div class="form-container">
          <form>
            <fieldset class="border p-4 rounded mb-4">
                <legend class="float-none w-auto px-3 text-primary fw-bold">Personal Information</legend>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="Enter full name" required pattern="[A-Za-z\s]+"/>

                        <div class="invalid-feedback">Please enter a valid name.</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label"> Email Address </label>
                        <input type="email" id="email" class="form-control" placeholder="Enter email"required />

                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="mobile" class="form-label">Mobile Number</label>
                        <input type="tel" id="mobile" class="form-control" placeholder="Enter mobile number" required pattern="[6-9]{1}[0-9]{9}"/>

                        <div class="invalid-feedback">Enter a valid 10-digit Indian mobile number.</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="dob" class="form-label">Date of Birth</label>
                        <input type="date" id="dob" class="form-control" required>

                        <div class="invalid-feedback">You must be at least 15 years old.</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="gender" class="form-label">Gender</label>
                        <select id="gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>

                        <div class="invalid-feedback">Please select your gender.</div>
                    </div>
                </div>

            </fieldset>
          </form>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
