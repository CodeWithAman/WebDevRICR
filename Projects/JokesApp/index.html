<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jokes App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light text-light">
    <header class="bg-success text-white text-center py-3 shadow">
      <h1 class="fw-bold">Jokes App 🤪🤣</h1>
    </header>

    <main>
      <div class="container border border-black mt-5 p-3 rounded-2 shadow">
        <div id="jokesSpace">
          <p id="setup" class="text-center text-black">

          </p>

          <p id="punchline" class="text-center text-black">

          </p>
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn btn-outline-success rounded-pill" onclick="GetNewJokes()">
            Get New Jokes
          </button>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
