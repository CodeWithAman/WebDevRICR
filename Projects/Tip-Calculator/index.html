<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip-Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    
    <div class="main-Container">
        <div class="text-center text-white fw-semibold fs-3 py-2 mx-auto heading-box">Tip Calculator</div>

        <div class="bg-light mt-2 p-4 card-box">
            <div class="mb-4 mt-3">
                <label for="billAmount" class="fs-4 mb-3 fw-semibold">Bill Amount</label>
                <div class="d-flex align-items-center border-bottom border-primary">
                    <input type="number" name="billAmount" id="billAmt" placeholder="Amount to be paid" class="form-control border-0 shadow-none bg-light px-0">
                    <span class="fs-4">₹</span>
                </div>
            </div>

            <div class="mb-4">
                <label for="services" class="fs-4 mb-3 fw-semibold">How was the service ?</label>
                <select name="services" id="service" class="form-select border-0 border-bottom border-primary rounded-0 bg-light px-1 fw-bold">
                    <option value="">Select</option>
                    <option value="0.25">25% - Top Notch</option>
                    <option value="0.20">20% - Excellent</option>
                    <option value="0.15">15% - Good</option>
                    <option value="0.10">10% - Bad</option>
                    <option value="0.05">5% - Worst</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="countPersons" class="fs-4 mb-3 fw-semibold">Total number of persons</label>
                <input type="number" name="countPerson" id="personCount" placeholder="Number of people sharing the bill" class="form-control border-0 border-bottom border-primary rounded-0 shadow-none bg-light px-0">
            </div>

            <button id="calculateBtn" class="btn text-white px-5 py-3 fs-4 mt-2 calculate-btn">Calculate</button>

            <div id="result" class="text-center fw-bold fs-5 mt-4 text-success"></div>
        </div>
    </div>


  <script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"
  ></script>
  <script src="script.js"></script>
</body>
</html>
