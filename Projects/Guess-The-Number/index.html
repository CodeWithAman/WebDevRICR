<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess The Number</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="vh-100 d-flex justify-content-center align-items-center bg-success-subtle">
    <div class="bg bg-info-subtle card p-5 rounded-4 shadow col-11 col-md-7 col-lg-5">
      
      <h1 class="text-center fw-bold display-4 text-success mb-4">Guess The Number</h1>
      <p class="text-center fs-6 text-secondary mb-5">
        We have selected a random number between 1 - 10.See if you can guess it.
      </p>

      <div class="form">
        <label for="guessField" class="form-label fs-4 fw-semibold mb-3"> Enter a guess: </label>

        <input type="text" id="guessField" class="form-control form-control-lg mb-4" />

        <input type="submit" value="Submit guess" class="btn btn-primary btn-lg w-100" id="submitguess"
        />
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
