<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 form-box w-258888">
      <h4 class="text-center mb-3">Form</h4>

      <div class="mb-3">
        <input type="text" id="name" class="form-control" placeholder="Enter Name: ">
      </div>
      <div class="mb-3">
        <input type="text" id="city"  class="form-control"  placeholder="Enter City: ">
      </div>

      <button class= "btn btn-primary w-100" onclick="showResults()">Submit</button>
    </div>

    <div id="result" class="m-4 card w-25 border rounded shadow p-3"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
